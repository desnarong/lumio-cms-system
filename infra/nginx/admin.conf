server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # CSP + security headers generated by the admin build (apps/admin/src/security/csp.ts).
  # Included per location: a location with its own add_header drops the server ones.

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    # index.html names the hashed bundle, so it must never be cached stale.
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
