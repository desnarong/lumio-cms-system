# Lumio behind a plain Nginx (VPS ที่มีระบบอื่นใช้พอร์ต 80/443 อยู่แล้ว)
#
# ถ้าเครื่องใช้ Nginx Proxy Manager (ผ่าน UI) ไม่ต้องใช้ไฟล์นี้ ให้สร้าง
# Proxy Host ชี้ไป renderer:49200, api:49100, admin:80 แทน (docs/DEPLOY-VPS.md ข้อ 6)
#
# ใช้แทน Caddy เมื่อพอร์ต 80/443 เป็นของ Nginx เดิม:
#   docker compose --env-file .env.docker --profile app up -d \
#     db redis minio migrate api worker admin renderer
# ไม่ต้องรัน service caddy เพราะ container ของแอปผูก 127.0.0.1 ทั้งหมด
#
# แทน savvyapp.cc ด้วยโดเมนจริง แล้วขอใบรับรองด้วย certbot:
#   certbot --nginx -d savvyapp.cc -d www.savvyapp.cc \
#     -d apilumio.savvyapp.cc -d admin.savvyapp.cc
#
# หมายเหตุ: โดเมนฟรีของลูกค้า (*.savvyapp.cc) ต้องใช้ wildcard certificate
# ซึ่ง certbot ต้องใช้ DNS-01 (ต้องมี plugin ของผู้ให้บริการ DNS) หรือใช้
# Cloudflare proxy ไม่งั้นเปิดได้เฉพาะ HTTP

# Public site (root domain + free subdomains)
server {
  listen 80;
  listen [::]:80;
  server_name savvyapp.cc www.savvyapp.cc *.savvyapp.cc;

  client_max_body_size 25m;

  location / {
    proxy_pass http://127.0.0.1:49200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
  }
}

# API (เบราว์เซอร์ของ admin และ renderer เรียกที่นี่)
server {
  listen 80;
  listen [::]:80;
  server_name apilumio.savvyapp.cc;

  # อัปโหลดสื่อ (MEDIA_STORAGE=local) วิ่งผ่าน API
  client_max_body_size 25m;

  location / {
    proxy_pass http://127.0.0.1:49100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}

# Admin SPA
server {
  listen 80;
  listen [::]:80;
  server_name admin.savvyapp.cc;

  location / {
    proxy_pass http://127.0.0.1:49300;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
