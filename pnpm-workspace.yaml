packages:
  - 'apps/*'
  - 'packages/*'

# Patched versions for advisories reported by `pnpm audit`
# (docs/design/23-security-review.md). Ranges are scoped so only the
# vulnerable versions move; older major lines used by other tools stay put.
overrides:
  multer@<2.3.0: ^2.3.0
  body-parser@<1.20.6: ^1.20.6
  qs@<6.16.0: ^6.16.0
  postcss@<8.5.23: ^8.5.23
  file-type@<21.3.2: ^21.3.2
  vite: ^6.4.4
  vitest: ^4.1.12
  '@vitest/mocker': ^4.1.12
  tinypool@<2.1.2: ^2.1.2
  picomatch@>=4.0.0 <4.0.4: ^4.0.4
  glob@>=10.2.0 <10.5.0: ^10.5.0
  tmp@<0.2.6: ^0.2.6
  ajv@>=7.0.0-alpha.0 <8.18.0: ^8.18.0
  webpack@<5.104.1: ^5.104.1

# Dependencies allowed to run install scripts. `msgpackr-extract` (an optional
# native accelerator for BullMQ's msgpack) stays false: msgpackr falls back to
# its JavaScript implementation, so nothing needs to be compiled.
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: true
  unrs-resolver: true
