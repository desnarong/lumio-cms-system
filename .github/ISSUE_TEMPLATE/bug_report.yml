name: Bug report
description: รายงานสิ่งที่ทำงานผิด
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ช่องโหว่ความปลอดภัย **ห้าม** แจ้งที่นี่ — อ่าน [SECURITY.md](../../SECURITY.md)
  - type: textarea
    id: what
    attributes:
      label: เกิดอะไรขึ้น
      description: อธิบายสิ่งที่เห็น และสิ่งที่ควรเป็น
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: ขั้นตอนทำให้เกิดซ้ำ
      placeholder: |
        1. เปิด /editor/...
        2. กด ...
        3. เห็น ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: รุ่น / commit
      placeholder: main @ abc1234
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: สภาพแวดล้อม
      description: OS, Node, pnpm, เบราว์เซอร์, และ log ที่เกี่ยวข้อง (ปิดข้อมูลลับก่อนวาง)
