name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://lumio:lumio@localhost:49432/lumio?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lumio
          POSTGRES_PASSWORD: lumio
          POSTGRES_DB: lumio
        ports:
          - 49432:5432
        options: >-
          --health-cmd "pg_isready -U lumio -d lumio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Advisory only: two advisories remain and neither is fixable in this
      # batch (braces has no published patched version; @nestjs/core needs a
      # Nest 11 major upgrade). See docs/design/23-security-review.md.
      - name: Dependency audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Prepare database
        run: |
          pnpm --filter api exec prisma migrate deploy
          pnpm --filter api exec prisma db seed

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build Storybook
        run: pnpm --filter @lumio/ui build-storybook

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The admin runs from in-memory demo data, so no database or API is needed.
      - name: End-to-end smoke tests
        run: pnpm test:e2e

      - name: Keep the trace of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The public renderer falls back to its built-in demo site when no API is
      # configured, so the budget is measured on the real templates and CSS.
      - name: Build renderer and its workspace dependencies
        run: pnpm --filter "renderer..." build

      - name: Lighthouse budgets (14-seo-performance.md 14.5)
        run: npx --yes @lhci/cli@0.15.1 autorun --config=.lighthouserc.json
        env:
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
